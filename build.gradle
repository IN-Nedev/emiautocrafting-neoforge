plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'com.example.emiautocrafting'
version = mod_version
base { archivesName = 'emiautocrafting-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://repo.sleeping.town'; content { includeGroup 'dev.emi' } }
}
neoForge {
    version = neo_version
    runs {
        client { client(); jvmArguments.addAll '-Xms256m', '-Xmx1536m' }
        server { server(); jvmArguments.addAll '-Xms256m', '-Xmx1024m'; programArgument '--nogui'; gameDirectory = file(project.findProperty('serverDir') ?: 'run-server') }
    }
    mods { emiautocrafting { sourceSet(sourceSets.main) } }
}
dependencies {
    implementation "dev.emi:emi-neoforge:${emi_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') { from('LICENSE'); from('NOTICE.md') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Opt-in runtime harness; never included in the release JAR.
if (project.hasProperty('integration')) {
    sourceSets { testMod }
    tasks.named('processTestModResources') { doFirst { delete destinationDir } }
    if (project.hasProperty('toolFixtures')) sourceSets.testMod.resources.srcDir 'src/toolTest/resources'
    configurations.testModImplementation.extendsFrom configurations.implementation
    sourceSets.testMod.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.testMod.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    tasks.register('testModJar', Jar) {
        archiveFileName = 'autocrafting-runtime-tests.jar'
        from sourceSets.testMod.output
    }
    neoForge.mods { autocrafting_test { sourceSet(sourceSets.testMod) } }
    neoForge.runs.client {
        systemProperty 'emiautocrafting.integration', 'true'
        systemProperty 'emiautocrafting.toolFixtures', project.hasProperty('toolFixtures').toString()
        systemProperty 'emiautocrafting.testMode', project.findProperty('testMode') ?: 'integrated'
        systemProperty 'emiautocrafting.testPort', project.findProperty('testPort') ?: '25565'
        systemProperty 'emiautocrafting.testFilter', project.findProperty('testFilter') ?: 'all'
        systemProperty 'emiautocrafting.clientFillOnly', project.hasProperty('clientFillOnly').toString()
        systemProperty 'emiautocrafting.staleStorageUpdate', project.hasProperty('staleStorageUpdate').toString()
        systemProperty 'emiautocrafting.fixtureDirectory', file(project.findProperty('fixtureDirectory') ?: '.local-testing/fixture-exchange').absolutePath
        if (project.hasProperty('testPace')) systemProperty 'emiautocrafting.testPace', project.property('testPace')
        programArguments.addAll '--username', 'AutocraftTest', '--width', '1000', '--height', '700'
    }
}
if (project.hasProperty('serverWithoutEmi')) {
    configurations.runtimeClasspath.exclude group: 'dev.emi'
}

if (project.hasProperty('serverOnly')) {
    sourceSets { serverRuntime { runtimeClasspath = configurations.runtimeClasspath } }
    neoForge.runs.server { loadedMods = []; sourceSet = sourceSets.serverRuntime }
}

// Local dedicated-server fixtures contain no production addon code or crafting hooks.
if (project.hasProperty('serverFixtures')) {
    if (!project.hasProperty('integration') || !project.hasProperty('serverOnly'))
        throw new GradleException('serverFixtures requires -Pintegration -PserverOnly')
    sourceSets.serverRuntime.runtimeClasspath += sourceSets.testMod.output
    neoForge.runs.server {
        loadedMods = [neoForge.mods.autocrafting_test]
        jvmArguments.add '-Xmx2G'
        systemProperty 'emiautocrafting.serverFixtures', 'true'
        systemProperty 'emiautocrafting.fixtureDirectory', file(project.findProperty('fixtureDirectory') ?: '.local-testing/fixture-exchange').absolutePath
    }
}

// Isolated KubeJS recipe fixtures; excluded from the release JAR.
if (project.hasProperty('kubejsFixtures')) {
    if (!project.hasProperty('integration')) throw new GradleException('kubejsFixtures requires -Pintegration')
    repositories { maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } } }
    dependencies {
        runtimeOnly 'curse.maven:kubejs-238086:8715199'
        runtimeOnly 'curse.maven:rhino-416294:8463898'
        runtimeOnly 'curse.maven:architectury-api-419699:8492726'
    }
    def fixtureDirectory = file(project.hasProperty('packagedTest') ? 'run-packaged' : 'run-kubejs')
    neoForge.runs.client {
        gameDirectory = fixtureDirectory
        jvmArguments.add '-Xmx2048m'
        systemProperty 'emiautocrafting.kubejsFixtures', 'true'
    }
    tasks.register('prepareKubejsFixtures', Copy) {
        from 'src/kubejsTest/kubejs'
        into new File(fixtureDirectory, 'kubejs')
    }
    tasks.named('runClient') { dependsOn 'prepareKubejsFixtures' }
}

// Optional storage tests load mod JARs from an explicitly supplied directory.
if (project.hasProperty('storageModsDirectory')) {
    if (!project.hasProperty('integration')) throw new GradleException('storageModsDirectory requires -Pintegration')
    dependencies {
        runtimeOnly fileTree(dir: project.property('storageModsDirectory'), includes: project.hasProperty('stationOnly') ? [
            'craftingstationjei-*.jar', 'jei-*.jar', 'sophisticatedstorage-*.jar', 'sophisticatedcore-*.jar'
        ] : [
            'craftingstationjei-*.jar', 'jei-*.jar', 'ars_nouveau-*.jar', 'curios-neoforge-*.jar',
            'geckolib-neoforge-*.jar', 'Patchouli-*.jar', 'appliedenergistics2-*.jar', 'guideme-*.jar',
            'sophisticatedstorage-*.jar', 'sophisticatedcore-*.jar', 'ae2wtlib-*.jar'
        ])
    }
    neoForge.runs.client {
        gameDirectory = file('run-storage')
        jvmArguments.add project.hasProperty('stationOnly') ? '-Xmx1536m' : '-Xmx3G'
        systemProperty 'emiautocrafting.storageCompatibility', 'true'
    }
}

// Optional Quark/SFM fixtures use installed mods without loading a complete modpack.
if (project.hasProperty('quarkModsDirectory')) {
    if (!project.hasProperty('integration')) throw new GradleException('quarkModsDirectory requires -Pintegration')
    dependencies {
        runtimeOnly fileTree(dir: project.property('quarkModsDirectory'), includes: ['Quark-*.jar', 'Zeta-*.jar', 'Super Factory Manager*.jar'])
    }
    neoForge.runs.client {
        gameDirectory = file('run-quark')
        jvmArguments.add '-Xmx2048m'
        systemProperty 'emiautocrafting.quarkCompatibility', 'true'
    }
}

// Verify the distributable itself, with production classes absent from the development mod paths.
if (project.hasProperty('packagedTest')) {
    if (!project.hasProperty('integration')) throw new GradleException('packagedTest requires -Pintegration')
    sourceSets.testMod.runtimeClasspath = sourceSets.testMod.output + configurations.testModRuntimeClasspath +
        (sourceSets.main.runtimeClasspath - sourceSets.main.output) + (project.hasProperty('testAddonJar') ? files(project.property('testAddonJar')) : files(tasks.named('jar')))
    neoForge.runs.client {
        sourceSet = sourceSets.testMod
        loadedMods = [neoForge.mods.autocrafting_test]
        gameDirectory = file('run-packaged')
        systemProperty 'emiautocrafting.packagedTest', 'true'
    }
    tasks.named('runClient') { dependsOn 'jar' }
}

// Mute before Minecraft loads its sound engine, including fresh test directories.
if (project.hasProperty('integration')) {
    if (project.hasProperty('clientDir')) neoForge.runs.client { gameDirectory = file(project.property('clientDir')) }
    tasks.named('runClient') {
        doFirst {
            def options = new File(neoForge.runs.client.gameDirectory.get().asFile, 'options.txt')
            options.parentFile.mkdirs()
            def lines = options.exists() ? options.readLines('UTF-8') : []
            lines.removeAll { it.startsWith('soundCategory_master:') }
            lines.add('soundCategory_master:0.0')
            options.setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}
